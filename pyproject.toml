[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neoagent"
version = "3.5.0"
description = "NeoAgent Studio - agentic engineering platform: CLI + desktop app + MCP, reasoning-action harness, closed-loop delivery and Harness L1-L7 governance"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [{name = "NeoAgent Team"}]
keywords = ["ai-agent", "llm", "langgraph", "agent-framework", "multi-agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

# Control plane (neo-devops, Studio server, MCP, skills) runs on the stdlib alone;
# enforced by tests/test_control_plane_stdlib.py.
dependencies = []

[project.optional-dependencies]
skills = ["pyyaml>=6.0"]
agent = [
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-anthropic>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "httpx>=0.27.0",
    "rich>=13.0.0",
    "prompt-toolkit>=3.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "tiktoken>=0.7.0",
    "apscheduler>=3.10.0",
    "tavily-python>=0.5.0",
    "beautifulsoup4>=4.12.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
]
memory = ["chromadb>=0.5.0"]
server = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
]
desktop = ["pywebview>=5.0"]
full = ["neoagent[skills,agent,memory,server,desktop]"]
all = [
    "neoagent[full]",
    "playwright>=1.45.0",
    "groq>=0.10.0",
    "langchain-ollama>=0.2.0",
    "keyring>=24.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.11.0",
    "pyyaml>=6.0",
]

[project.scripts]
neo = "neoagent.cli.main:main"
neoagent = "neoagent.cli.main:main"
neo-devops = "neoagent.cli.devops_cli:entry_point"
neo-desktop = "neoagent.desktop.launcher:main"
neoagent-mcp = "neoagent.mcp.server:main"
neoagent-server = "neoagent.server.app:main"

[tool.setuptools.packages.find]
include = ["neoagent*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "E402", "B008", "UP042"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.pytest.ini_options]
testpaths = ["tests"]
